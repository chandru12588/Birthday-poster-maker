<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday Bharti</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    body {
      background: linear-gradient(180deg, #fffaf5 0%, #ffe6f2 100%);
      overflow: hidden;
    }
    .poster {
      width: 900px;
      height: 1200px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      background: linear-gradient(180deg, #fffaf0 0%, #fff1f7 100%);
      position: relative;
    }
    .photo-wrap {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      overflow: hidden;
      border: 8px solid rgba(255,255,255,0.85);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      background: #f3f4f6;
    }
    /* Snow + flower animation keyframes */
    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120vh) rotate(360deg); opacity: 0; }
    }
    .flake, .petal {
      position: fixed;
      top: -10px;
      font-size: 1rem;
      animation: fall linear infinite;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="flex flex-col md:flex-row gap-8 justify-center items-start p-8">

  <div id="poster" class="poster p-10 flex flex-col items-center text-center relative z-10">
    <h1 class="text-6xl font-extrabold text-pink-600 drop-shadow mt-6">Happy Birthday</h1>
    <p class="text-3xl text-slate-700 mt-2">to</p>

    <div class="mt-6 flex items-center justify-center gap-6">
      <div class="photo-wrap" id="photoPreview">
        <img id="photoImg" src="" alt="" class="w-full h-full object-cover hidden" />
        <div id="photoPlaceholder" class="w-full h-full flex items-center justify-center text-slate-400 text-sm">
          No photo
        </div>
      </div>
      <div class="text-left">
        <div class="text-4xl font-bold text-slate-800" id="nameDisplay">Bharti</div>
        <div class="text-xl text-amber-600 font-semibold mt-1">Turning <span id="ageDisplay">26</span> 🎉</div>
      </div>
    </div>

    <div class="max-w-[70%] mt-8">
      <p id="wishDisplay" class="text-lg text-slate-700 leading-relaxed">
        May God bless you with success, peace, and endless happiness.  
        Have a beautiful birthday celebration, Bharti 🌸❄️
      </p>
    </div>

    <div class="mt-auto mb-8">
      <div class="inline-flex items-center gap-3 bg-white/70 px-4 py-2 rounded-2xl shadow">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-amber-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 3.99 4 6.5 4c1.74 0 3.41.81 4.5 2.09C12.09 4.81 13.76 4 15.5 4 18 4 20 6 20 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span class="text-sm text-slate-800">With love and prayers 💖</span>
      </div>
    </div>
  </div>

  <!-- Editor Panel -->
  <div class="w-full max-w-md bg-white p-6 rounded-xl shadow z-10">
    <h2 class="text-2xl font-bold mb-3">Poster Editor</h2>
    <label class="block mb-3">
      <span class="block text-sm font-medium text-slate-600">Name</span>
      <input id="nameInput" class="mt-1 block w-full rounded-md border px-3 py-2" type="text" value="Bharti" />
    </label>
    <label class="block mb-3">
      <span class="block text-sm font-medium text-slate-600">Age</span>
      <input id="ageInput" class="mt-1 block w-32 rounded-md border px-3 py-2" type="number" min="1" max="120" value="26" />
    </label>
    <label class="block mb-4">
      <span class="block text-sm font-medium text-slate-600">Your wish</span>
      <textarea id="wishInput" rows="4" class="mt-1 block w-full rounded-md border px-3 py-2">May God bless you with peace and success. Happy 26th birthday Bharti!</textarea>
    </label>
    <label class="block mb-4">
      <span class="block text-sm font-medium text-slate-600">Add Photo</span>
      <input id="photoInput" type="file" accept="image/*" class="mt-2" />
    </label>
    <div class="flex gap-2">
      <button id="downloadBtn" class="flex-1 bg-pink-600 hover:bg-pink-700 text-white font-semibold px-4 py-2 rounded-md">Download Poster</button>
      <button id="resetBtn" class="bg-gray-200 text-slate-700 px-4 py-2 rounded-md">Reset</button>
    </div>
  </div>

  <script>
    // Elements
    const nameInput = document.getElementById('nameInput');
    const ageInput = document.getElementById('ageInput');
    const wishInput = document.getElementById('wishInput');
    const nameDisplay = document.getElementById('nameDisplay');
    const ageDisplay = document.getElementById('ageDisplay');
    const wishDisplay = document.getElementById('wishDisplay');
    const photoInput = document.getElementById('photoInput');
    const photoImg = document.getElementById('photoImg');
    const photoPlaceholder = document.getElementById('photoPlaceholder');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const poster = document.getElementById('poster');

    nameInput.addEventListener('input', () => nameDisplay.textContent = nameInput.value || 'Bharti');
    ageInput.addEventListener('input', () => ageDisplay.textContent = ageInput.value || '26');
    wishInput.addEventListener('input', () => wishDisplay.textContent = wishInput.value);

    photoInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        photoImg.src = ev.target.result;
        photoImg.classList.remove('hidden');
        photoPlaceholder.style.display = 'none';
      };
      reader.readAsDataURL(file);
    });

    downloadBtn.addEventListener('click', async () => {
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Preparing...';
      const canvas = await html2canvas(poster, { scale: 2 });
      const link = document.createElement('a');
      link.download = `${nameInput.value || 'Bharti'}-birthday-poster.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      downloadBtn.disabled = false;
      downloadBtn.textContent = 'Download Poster';
    });

    resetBtn.addEventListener('click', () => location.reload());

    // Create floating snowflakes and flowers
    const emojis = ['❄️','🌸','🌷','❅','🌼','❆'];
    for (let i = 0; i < 40; i++) {
      const el = document.createElement('div');
      el.className = Math.random() > 0.5 ? 'flake' : 'petal';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (Math.random() * 20 + 10) + 'px';
      el.style.animationDuration = (Math.random() * 8 + 6) + 's';
      el.style.animationDelay = (Math.random() * 5) + 's';
      document.body.appendChild(el);
    }
  </script>
</body>
</html>
